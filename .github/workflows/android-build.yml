name: Aviary Pro Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore permanent debug keystore
        shell: bash
        env:
          AVIARY_KEYSTORE_B64: ${{ secrets.AVIARY_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$AVIARY_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Verify permanent signing certificate
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          ACTUAL="$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | sed -n 's/.*SHA-1 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
          EXPECTED="14963e82a9f638d55cc0497f3edb5e708e3e36cd"

          echo "APK SHA-1: $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: Aviary Pro signing certificate mismatch"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AviaryPro-v1.4.11
          path: build/app/outputs/flutter-apk/app-release.apk
